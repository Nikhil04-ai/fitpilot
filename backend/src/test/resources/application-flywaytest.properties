# Overlay profile for FlywayMigrationTest only, activated as @ActiveProfiles({"test","flywaytest"}).
#
# It exists because the `test` profile turns Flyway off, and a profile-specific file
# listed later wins over an earlier one -- whereas @TestPropertySource(properties=...)
# is evaluated too late to re-enable an auto-configuration that was already switched
# off by @ConditionalOnProperty at context creation.
spring.datasource.url=jdbc:h2:mem:flyway_validate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# The point of this profile: Flyway builds the schema, Hibernate has to accept it.
spring.jpa.hibernate.ddl-auto=validate
