# ── Test database: H2 in-memory ───────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Flyway is OFF for the general test profile on purpose. These tests share one
# in-memory database across every cached Spring context, and create-drop is what
# resets it between them -- migrating instead would leave one test class's rows
# visible to the next. The migrations themselves are exercised, on their own
# isolated H2 database and with ddl-auto=validate, by FlywayMigrationTest.
spring.flyway.enabled=false
# Hibernate 7 auto-detects H2 dialect — do NOT set explicitly or it logs a deprecation warning

# Disable open-in-view in tests too
spring.jpa.open-in-view=false

# Suppress SQL noise in test output
spring.jpa.show-sql=false
logging.level.org.hibernate.sql=WARN
logging.level.org.springframework.security=WARN
logging.level.com.project.fitness=WARN
logging.level.org.springframework.web=WARN

# JWT — test-only secret (safe to commit, NOT for production)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLXRoYXQtaXMtbG9uZy1lbm91Z2gtMjU2LWJpdHM=
jwt.expiration.ms=86400000

# Gemini disabled in tests
gemini.api.key=

# Suppress SpringDoc warnings in test logs
logging.level.org.springframework.core.events=WARN

# Disable SpringDoc endpoints in tests (removes WARN logs about /v3/api-docs and /swagger-ui)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Rate limits, raised for tests. The whole integration suite registers and logs in
# from 127.0.0.1 against one shared filter instance, so the production auth cap of 10
# per minute would throttle the suite itself. RateLimitingFilterTest constructs the
# filter directly with explicit capacities, so it still covers the real numbers.
app.rate-limit.auth=10000
app.rate-limit.ai=10000
app.rate-limit.standard=10000
app.rate-limit.invite=10000
