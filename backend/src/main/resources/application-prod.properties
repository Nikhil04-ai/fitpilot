# The deployed instance (PLAN P5-14 to P5-16). render.yaml switches this on with
# SPRING_PROFILES_ACTIVE=prod; local runs and the test suite never load it.
#
# Everything here is a setting that is right for local development and wrong once real
# people use the app. ProductionSettingsCheck refuses to start this profile without
# FRONTEND_URL and a working mail setup, so a forgotten variable is a failed deploy
# rather than reset links that point at localhost or are written to the log.

# Never log SQL text here, whatever SHOW_SQL says.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# API.md is the reference; the deployed instance does not publish its own map.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Only FRONTEND_URL may call this API from a browser: no localhost, no file:// (Origin: null).
app.cors.allow-local-origins=false
