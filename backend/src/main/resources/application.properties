spring.application.name=fitness-monolith
# Render assigns its own port at runtime - do NOT hardcode this.
server.port=${PORT:8080}
# Set explicitly to silence the Spring startup warning. Keep true: services
# rely on the request-scoped session to read lazy relationships.
spring.jpa.open-in-view=true
# Local dev secrets live in backend/local.properties (git-ignored, never committed).
# 'optional:' means startup does NOT fail when the file is absent - on Render the
# same keys come from real environment variables instead.
spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties

# ??? Database ????????????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitness_demo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD}
# Hibernate auto-detects the dialect from the driver; no need to set it explicitly.
# Setting it causes a deprecation warning in Hibernate 7.
# Flyway owns the schema now - see src/main/resources/db/migration.
# 'validate' means Hibernate checks the mapping against the migrated schema and
# refuses to start if they disagree, instead of quietly ALTERing the database at
# boot the way 'update' did. A schema change is a new V<n>__ file, never a mapping
# edit on its own.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ??? JWT ?????????????????????????????????????????????????????????????????????
# Never hardcode these. Set them as environment variables in IntelliJ:
#   Run ? Edit Configurations ? Environment Variables
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=172800000

# ??? Gemini AI (Features 9 + 10) ?????????????????????????????????????????????
# Optional. App works without it ? Features 9/10 return a clear message if missing.
# Get a FREE key at: https://aistudio.google.com/app/apikey
# Then add to IntelliJ environment variables:  GEMINI_API_KEY=your_key
gemini.api.key=${GEMINI_API_KEY:}
# Both bound explicitly, for the same reason as app.frontend-url below: Spring maps
# GEMINI_MODEL to `gemini.model`, not `gemini.api.model`, so the README's variables were
# silently ignored. The default is an alias Google keeps pointed at its current
# Flash-Lite, so it is not retired underneath us the way gemini-1.5-flash and
# gemini-2.0-flash were. Lite rather than full Flash because it answers in ~2s; the
# larger models took ~45s, past the read timeout, and every call fell back.
gemini.api.model=${GEMINI_MODEL:gemini-flash-lite-latest}
gemini.api.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}


# --- Flyway --------------------------------------------------------------------
spring.flyway.enabled=true
# Two locations. db/migration is portable SQL that every database runs, and is what
# the H2-backed FlywayMigrationTest verifies the entity mapping against. db/vendor/mysql
# holds migrations that need MySQL-only syntax (so far: a JSON backfill H2 cannot run).
# They are kept apart because Flyway scans a location recursively — a vendor folder
# nested inside db/migration would be picked up on H2 too.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
# The Aiven instance and every existing local database already have the V1 tables,
# built by the old ddl-auto=update. Without this, Flyway finds a non-empty schema
# with no history table and aborts. With it, those databases are stamped at V1 and
# start applying from V2; a fresh database runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema as built by ddl-auto=update
# Fail fast rather than silently skipping a migration whose file changed after it ran.
spring.flyway.validate-on-migrate=true

# --- Frontend origin -----------------------------------------------------------
# Read by SecurityConfig (CORS) and by the password reset link builder.
#
# This line is what actually connects the two. Both read `app.frontend-url`, and
# render.yaml sets FRONTEND_URL - but Spring maps that env var to `frontend.url`,
# not `app.frontend-url`, so without this binding the deployed origin was silently
# never applied and CORS fell back to localhost only.
app.frontend-url=${FRONTEND_URL:}

# --- Password reset + outbound email (PLAN P1-4) -------------------------------
# Optional, like the Gemini key: with no api-key set the reset link is written to the
# log instead of emailed, so the flow is completable locally and a missing key never
# becomes a 500 for someone trying to recover their account.
#
# HTTPS rather than SMTP because Render blocks outbound SMTP ports on the free tier,
# where an SMTP client would pass every test and then silently deliver nothing.
#
# MAIL_PROVIDER is brevo (default) or resend. Brevo delivers to any address once the
# MAIL_FROM sender is verified in its dashboard; Resend, without a verified domain,
# only delivers to its own account's address. MAIL_FROM must be that verified sender,
# as "FitPilot <you@gmail.com>". MAIL_API_URL overrides the provider's endpoint and
# is normally left blank. The startup log says in one line whether email is on.
app.mail.provider=${MAIL_PROVIDER:brevo}
app.mail.api-key=${MAIL_API_KEY:}
app.mail.api-url=${MAIL_API_URL:}
app.mail.from=${MAIL_FROM:}

# A reset token is a password equivalent while it lives, so it does not live long.
app.password-reset.ttl-minutes=30
app.password-reset.min-length=8

# --- Rate limiting (requests per minute, per instance) --------------------------
# Four tiers. Auth is strict and keyed by IP, because the traffic it exists to slow
# down -- credential stuffing and mass signup -- has no account to key on. AI routes
# each cost a Gemini call against a shared quota. Invite covers friend requests and new
# challenges, which land in someone else's notifications. Every other /api route gets
# the standard allowance: unlisted routes are no longer unlimited (PLAN P4-5). Tunable
# here so a live instance under attack can be tightened without a redeploy of new code.
#
# Client addresses: RateLimitingFilter keys the auth tier on getRemoteAddr(). Behind
# Render's proxy that is the proxy, so Tomcat's RemoteIpValve resolves it from
# X-Forwarded-For -- but only from entries an internal proxy added (Tomcat's default
# list: private, loopback and link-local ranges), so an entry the client wrote itself
# is skipped. The filter used to read the header directly, which let any client pick a
# fresh bucket per request. If Render's proxy ever connects from outside those ranges,
# set SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES rather than trusting the header again.
server.forward-headers-strategy=native
app.rate-limit.auth=10
app.rate-limit.ai=10
app.rate-limit.standard=100
app.rate-limit.invite=10

# ??? Pagination defaults (Phase 4) ???????????????????????????????????????????
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
